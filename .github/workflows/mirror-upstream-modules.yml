name: Mirror compatible upstream module ZIPs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lumina Modules
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and validate upstream module ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          source_url = "https://raw.githubusercontent.com/kas021/Synthetiq-Modules/main/repository.json"
          req = urllib.request.Request(source_url, headers={"User-Agent": "Lumina-Modules-Mirror"})
          with urllib.request.urlopen(req, timeout=60) as response:
              source = json.load(response)

          modules = [
              item for item in source.get("modules", [])
              if isinstance(item, dict)
              and item.get("moduleId")
              and "synthetiq" not in str(item.get("moduleId", "")).lower()
          ]
          if not modules:
              raise SystemExit("No non-Synthetiq modules found in upstream catalogue.")

          out = Path("mirror-downloads")
          out.mkdir(exist_ok=True)
          assets = []
          failures = []

          for item in modules:
              module_id = str(item["moduleId"])
              version = str(item.get("version", "unknown"))
              url = str(item.get("packageUrl", ""))
              expected = str(item.get("sha256", "")).lower()
              if not url.startswith("https://") or len(expected) != 64:
                  failures.append(f"{module_id}: missing HTTPS package URL or SHA-256")
                  continue

              filename = f"{module_id}-{version}.zip"
              path = out / filename
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Lumina-Modules-Mirror"})
                  with urllib.request.urlopen(req, timeout=180) as response, path.open("wb") as target:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          target.write(chunk)

                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      raise ValueError(f"SHA-256 mismatch (expected {expected}, got {actual})")

                  with zipfile.ZipFile(path) as archive:
                      files = [n for n in archive.namelist() if not n.endswith("/")]
                      manifests = [n for n in files if n.lower().endswith(".json")]
                      scripts = [n for n in files if n.lower().endswith(".js")]
                      if len(manifests) != 1:
                          raise ValueError(f"ZIP has {len(manifests)} JSON files; Lumina installer requires exactly one")
                      if not scripts:
                          raise ValueError("ZIP contains no JavaScript entry file")

                  assets.append({
                      "moduleId": module_id,
                      "version": version,
                      "contentType": item.get("contentType", "video"),
                      "description": (
                          item.get("description")
                          or item.get("presentation", {}).get("purpose")
                          or item.get("presentation", {}).get("category")
                          or "Mirrored upstream module; runtime compatibility still needs testing."
                      ),
                      "filename": filename,
                      "sha256": actual
                  })
                  print(f"Validated {filename} ({path.stat().st_size} bytes)")
              except Exception as exc:
                  path.unlink(missing_ok=True)
                  failures.append(f"{module_id}@{version}: {exc}")

          if failures:
              print("The following modules were not safe to publish as installable ZIPs:")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(f"{len(failures)} upstream module package(s) failed validation; no release was published.")

          tag = "upstream-mirror-" + datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          with open("mirror-assets.json", "w", encoding="utf-8") as handle:
              json.dump({"tag": tag, "assets": assets}, handle, indent=2)
          print(f"Prepared {len(assets)} packages for release {tag}")
          PY

      - name: Publish ZIP packages as Lumina Modules release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("mirror-assets.json"))["tag"])')
          gh release create "$TAG" mirror-downloads/*.zip \
            --title "Mirrored upstream modules $TAG" \
            --notes "Mirrored individual ZIP packages from kas021/Synthetiq-Modules, excluding every module whose ID contains 'synthetiq'. SHA-256 values were checked against the upstream catalogue. These are byte-for-byte upstream packages; successful installation does not guarantee Lumina runtime or playback compatibility."

      - name: Update Lumina catalogue
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.load(open("mirror-assets.json", encoding="utf-8"))
          repo_path = Path("repository.json")
          repository = json.loads(repo_path.read_text(encoding="utf-8"))
          imported = []
          for item in data["assets"]:
              imported.append({
                  "moduleId": item["moduleId"],
                  "version": item["version"],
                  "contentType": item["contentType"],
                  "description": item["description"],
                  "packageUrl": f"https://github.com/bamelankur/Lumina-Modules/releases/download/{data['tag']}/{item['filename']}",
                  "sha256": item["sha256"]
              })

          imported_ids = {item["moduleId"] for item in imported}
          existing = repository.get("modules", [])
          # Keep native Lumina modules and any other entries, replacing prior mirrors
          # of IDs that are refreshed in this run. Never retain IDs containing synthetiq.
          kept = [
              item for item in existing
              if item.get("moduleId") not in imported_ids
              and "synthetiq" not in str(item.get("moduleId", "")).lower()
          ]
          repository["modules"] = kept + imported
          repo_path.write_text(json.dumps(repository, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Catalogue now has {len(repository['modules'])} entries, including {len(imported)} mirrored packages.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json
          git commit -m "Add mirrored upstream module packages excluding Synthetiq-named modules"
          git push origin HEAD:main
